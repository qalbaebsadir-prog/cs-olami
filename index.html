<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Olami</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e9d8;--card:#fbf6ea;--ink:#231f1a;--mute:#6f6558;--line:#d9cdb4;--ct:#2f5d8a;--t:#c9772b;--g:#3f8a52;--v:#7a4fb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#26231f;--ink:#f0e8d8;--mute:#a79c8a;--line:#3a352e;--ct:#6ea0d2;--t:#e39a52;--g:#7cc48a;--v:#b48ae0}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#26231f;--ink:#f0e8d8;--mute:#a79c8a;--line:#3a352e;--ct:#6ea0d2;--t:#e39a52;--g:#7cc48a;--v:#b48ae0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.mb{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.ttl{font:700 26px/1 'Barlow Condensed',Impact,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h2{font:700 24px/1 'Barlow Condensed',Impact,sans-serif;margin:22px 0 10px}
.tag{font:400 12px Barlow,sans-serif;color:var(--mute);margin-left:6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.sc{font:700 22px 'Barlow Condensed',sans-serif;white-space:nowrap}
.live{color:var(--t);font-size:12px}
.news{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.nc{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:8px;padding:12px}
.nc b{font:600 19px/1.15 'Barlow Condensed',sans-serif;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ct);border-radius:8px;padding:10px 6px;text-align:center;color:inherit;font:inherit;cursor:pointer}
.pc .n{font:700 24px/1.1 'Barlow Condensed',sans-serif;display:block;overflow-wrap:anywhere}
.m{color:var(--mute);font-size:13px}
.p{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ct);border-radius:8px;margin-bottom:10px}
.h{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.nick{font:700 28px/1 'Barlow Condensed',sans-serif}
.b{display:none;padding:0 12px 14px}
.p.open .b{display:block}
.b h3{font:600 18px 'Barlow Condensed',sans-serif;margin:12px 0 4px}
.b ul{margin:0;padding-left:18px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--t)}
.view{display:none}.view.on{display:block}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:8}
.dim.on{display:block}
.dr{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--card);z-index:9;transform:translateX(-100%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px;display:flex;flex-direction:column;gap:6px}
.dr.on{transform:none}
.dr button{text-align:left;padding:14px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 20px 'Barlow Condensed',sans-serif;cursor:pointer}
.none{color:var(--mute);text-align:center;padding:16px;grid-column:1/-1}

h2{padding-left:10px;border-left:5px solid var(--c,var(--ct))}
#home h2:nth-of-type(1){--c:var(--g)}
#home h2:nth-of-type(2){--c:var(--v)}
#home h2:nth-of-type(3){--c:var(--t)}
.mb{border-color:var(--t);color:var(--t)}
.live{color:var(--g);font-weight:600}.end{color:var(--mute);font-weight:400}
.nc,.pc,.p{--c:var(--ct);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.nc,.pc{border-top-color:var(--c)}
.p{border-left-color:var(--c)}
.pc .n,.nick{color:var(--c)}
.nc:nth-child(4n+1),.pc:nth-child(4n+1),.p:nth-child(4n+1){--c:var(--ct)}
.nc:nth-child(4n+2),.pc:nth-child(4n+2),.p:nth-child(4n+2){--c:var(--t)}
.nc:nth-child(4n+3),.pc:nth-child(4n+3),.p:nth-child(4n+3){--c:var(--g)}
.nc:nth-child(4n+4),.pc:nth-child(4n+4),.p:nth-child(4n+4){--c:var(--v)}
.dr button{border-left:4px solid var(--ct)}
.dr button:nth-child(4n+2){border-left-color:var(--t)}
.dr button:nth-child(4n+3){border-left-color:var(--g)}
.dr button:nth-child(4n+4){border-left-color:var(--v)}
.av{display:flex;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;align-items:center;justify-content:center;background:var(--c);color:var(--bg);font:700 22px 'Barlow Condensed',sans-serif}
.mc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.mi{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.crest{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.crest.logoc{background:var(--card)!important;box-shadow:inset 0 0 0 1px var(--line)}
.crest.logoc img{width:78%;height:78%;object-fit:contain}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .crest.logoc img{filter:invert(1)}}
:root[data-theme="dark"] .crest.logoc img{filter:invert(1)}
.vs{color:var(--mute);font-size:11px;font-weight:600}
.mt{display:flex;flex-direction:column;min-width:0}.mt b{font:600 18px/1.15 'Barlow Condensed',sans-serif}
.sl{position:relative;flex:0 0 100%;aspect-ratio:16/7;scroll-snap-align:start;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.slc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px}
.crestbig{width:76px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.vsbig{color:var(--mute);font:700 15px 'Barlow Condensed',sans-serif}
.ov{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.ov b{font:600 19px 'Barlow Condensed',sans-serif}
.ov .live{color:#8fe0a0}.ov .end{color:#d8d0c0}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scroll-padding:0 16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}

.av{display:block;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:var(--card)}
.av svg{width:100%;height:100%}
.bav{margin:0 10px 0 0;flex:0 0 44px}
.h{align-items:center}
.nc{display:flex;flex-direction:column}
.nb{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;transition:none}
.nb.full{-webkit-line-clamp:unset}
.more{align-self:flex-start;margin-top:6px;padding:0;border:0;background:none;color:var(--c,var(--t));font:600 14px Barlow,sans-serif;cursor:pointer;text-decoration:underline}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--mute);font:600 13px Barlow,sans-serif;cursor:pointer}
.lang button.on{background:var(--t);border-color:var(--t);color:#fff}
</style>
</head>
<body>
<div class="top"><button class="mb" id="mb" aria-label="Menyu">☰</button><span class="ttl">CS Olami</span><div class="lang" id="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div></div>
<div class="dim" id="dim"></div>
<nav class="dr" id="dr">
<button data-v="home" data-i="m_home"></button>
<button data-v="bio" data-i="m_bio"></button>
<button data-v="matches" data-i="m_matches"></button>
<button data-v="teams" data-i="m_teams"></button>
<button data-v="transfers" data-i="m_transfers"></button>
</nav>
<main>
<section class="view on" id="home">
<input id="q" type="search" placeholder="">
<h2><span data-i="today"></span><span class="tag" data-i="tag_today"></span></h2>
<div id="today"></div>
<h2><span data-i="news"></span><span class="tag" data-i="tag_news"></span></h2>
<div class="news" id="news"></div>
<h2 data-i="players"></h2>
<div class="grid" id="grid"></div>
</section>
<section class="view" id="bio"><h2 data-i="bio_h"></h2><div id="bl"></div></section>
<section class="view" id="matches"><h2><span data-i="matches"></span><span class="tag" data-i="tag_matches"></span></h2><div id="ml"></div><h2><span data-i="pr"></span><span class="tag" data-i="tag_pr"></span></h2><div id="pr"></div></section>
<section class="view" id="teams"><h2><span data-i="tr"></span><span class="tag" data-i="tag_tr"></span></h2><div id="tl"></div></section>
<section class="view" id="transfers"><h2><span data-i="tf"></span><span class="tag" data-i="tag_tf"></span></h2><div id="tr"></div></section>
</main>

function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rows(a,f){return a.map(f).join('')}
function crest(name){if(LOGO[name])return '<div class="crest logoc"><img src="'+LOGO[name]+'" alt="'+name+'"></div>';
var h=0,i;for(i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%9973;
var hue=h%360,c1="hsl("+hue+",42%,40%)",c2="hsl("+hue+",42%,26%)";
var init=name.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
return '<div class="crest" style="background:linear-gradient(160deg,'+c1+','+c2+')">'+init+'</div>'}
function stat(m){return m[3]?'<span class="live">LIVE</span>':'<span class="live end">'+tx('end')+'</span>'}
function mc(m){return '<div class="mc"><div class="mi">'+crest(m[0])+'<span class="vs">vs</span>'+crest(m[1])+'</div><div class="mt"><b>'+m[0]+' – '+m[1]+'</b><span class="sc">'+m[2]+' '+stat(m)+'</span></div></div>'}
function sl(m){return '<div class="sl"><div class="slc"><div class="crestbig">'+crest(m[0])+'</div><span class="vsbig">VS</span><div class="crestbig">'+crest(m[1])+'</div></div><div class="ov"><b>'+m[0]+' – '+m[1]+'</b><span class="sc">'+m[2]+' '+stat(m)+'</span></div></div>'}
function avatar(p){if(IMG[p.nick])return '<img src="'+IMG[p.nick]+'" alt="'+esc(p.nick)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';var h=0,i,x=p.nick;for(i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))%9973;
var hue=h%360,sk="hsl("+hue+",30%,62%)",jc="hsl("+((hue+200)%360)+",38%,38%)",init=p.nick.charAt(0).toUpperCase();
return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="'+jc+'" opacity=".18"/>'+
'<path d="M20 100 C20 70 30 62 40 58 L60 58 C70 62 80 70 80 100 Z" fill="'+jc+'"/>'+
'<rect x="42" y="56" width="16" height="10" fill="'+sk+'"/>'+
'<circle cx="50" cy="40" r="19" fill="'+sk+'"/>'+
'<path d="M31 36 C31 20 69 20 69 36 L69 30 C60 24 40 24 31 30 Z" fill="#2a2420"/>'+
'<text x="50" y="86" text-anchor="middle" font-family="\'Barlow Condensed\',sans-serif" font-weight="700" font-size="20" fill="#fff" opacity=".85">'+init+'</text></svg>'}
function renderNews(){
$('news').innerHTML=rows(N,function(n,i){return '<div class="nc"><b>'+esc(L(n[0]))+'</b><span class="m nb" id="nb'+i+'">'+esc(L(n[1]))+'</span><button class="more" id="mo'+i+'">'+tx('more')+'</button></div>'});
N.forEach(function(_,i){var b=$('mo'+i),e=$('nb'+i);
b.onclick=function(){e.classList.toggle('full');b.textContent=e.classList.contains('full')?tx('less'):tx('more')}})}
function checkMore(){N.forEach(function(_,i){var b=$('mo'+i),e=$('nb'+i);if(!b||!e)return;
if(e.classList.contains('full')){b.style.display='';return}
b.style.display=(e.scrollHeight>e.clientHeight+2)?'':'none'})}
function grid(){var q=$('q').value.trim().toLowerCase();var r=P.filter(function(p){return (p.nick+p.name+p.team+p.country).toLowerCase().indexOf(q)>-1});
$('grid').innerHTML=r.length?rows(r,function(p){return '<button class="pc" data-n="'+esc(p.nick)+'"><span class="av">'+avatar(p)+'</span><span class="n">'+esc(p.nick)+'</span><span class="m">'+esc(p.country)+'</span></button>'}):'<div class="none">'+tx('none')+'</div>'}
function bio(open){var o=typeof open==='string'?[open]:(open||[]);
$('bl').innerHTML=rows(P,function(p){return '<div class="p'+(o.indexOf(p.nick)>-1?' open':'')+'" data-n="'+esc(p.nick)+'"><button class="h"><span class="av bav">'+avatar(p)+'</span><div><div class="nick">'+esc(p.nick)+'</div><div class="m">'+esc(p.name)+' · '+esc(p.country)+' · '+esc(p.role)+'</div></div><span>▾</span></button><div class="b"><div class="m">'+tx('team')+': '+esc(p.team)+'<br>'+tx('born_l')+': '+esc(p.born)+'</div><h3>'+tx('bio_l')+'</h3><div>'+esc(p.bio)+'</div><h3>'+tx('ach_l')+'</h3><ul>'+rows(p.ach,function(a){return '<li>'+esc(a)+'</li>'})+'</ul><h3>'+tx('hours_l')+'</h3><div class="bar"><i style="width:'+(p.hours/14*100)+'%"></i></div><div class="m">~'+p.hours+' '+tx('h_u')+'</div><h3>'+tx('when_l')+'</h3><div>'+esc(p.when)+'</div></div></div>'})}
function renderAll(){
P=buildP();
document.documentElement.lang=LANG;
var e=document.querySelectorAll('[data-i]'),i;for(i=0;i<e.length;i++)e[i].textContent=tx(e[i].getAttribute('data-i'));
$('q').placeholder=tx('search');$('mb').setAttribute('aria-label',tx('menu'));
var lb=document.querySelectorAll('#lang button');for(i=0;i<lb.length;i++)lb[i].classList.toggle('on',lb[i].getAttribute('data-l')===LANG);
$('today').className='car';$('today').innerHTML=rows(M.slice(0,4),sl);
$('ml').innerHTML=rows(M,mc);
renderNews();
$('pr').innerHTML=rows(P.slice().sort(function(a,b){return b.r-a.r}),function(p,i){return '<div class="row"><span>'+(i+1)+'. '+esc(p.nick)+'</span><span class="sc">'+p.r.toFixed(2)+'</span></div>'});
$('tl').innerHTML=rows(T,function(t,i){return '<div class="row"><span>'+(i+1)+'. '+t[0]+'</span><span class="sc">'+t[1]+'</span></div>'});
$('tr').innerHTML=rows(X,function(x){return '<div class="row"><span>'+esc(L(XT[x[0]]))+'</span><span class="m">'+esc(x[1])+' → '+esc(x[2])+'</span></div>'});
var op=[].map.call(document.querySelectorAll('#bl .p.open'),function(n){return n.getAttribute('data-n')});
grid();bio(op);
if($('home').classList.contains('on'))checkMore()}
function go(v){var e=document.querySelectorAll('.view');for(var i=0;i<e.length;i++)e[i].classList.remove('on');$(v).classList.add('on');menu(false);window.scrollTo(0,0);if(v==='home')checkMore()}
function menu(o){$('dr').classList.toggle('on',o);$('dim').classList.toggle('on',o)}
$('mb').onclick=function(){menu(true)};$('dim').onclick=function(){menu(false)};
$('dr').onclick=function(e){var v=e.target.getAttribute('data-v');if(v){if(v==='bio')bio();go(v)}};
$('grid').onclick=function(e){var c=e.target.closest('.pc');if(c){bio(c.getAttribute('data-n'));go('bio')}};
$('bl').onclick=function(e){var h=e.target.closest('.h');if(h)h.parentNode.classList.toggle('open')};
$('lang').onclick=function(e){var l=e.target.getAttribute('data-l');if(l&&l!==LANG){LANG=l;try{localStorage.setItem('lang',l)}catch(x){}renderAll()}};
$('q').oninput=grid;
renderAll();
window.addEventListener('load',checkMore);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(checkMore);
</script>
